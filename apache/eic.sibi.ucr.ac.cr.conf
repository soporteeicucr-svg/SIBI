# Vhost para el Apache del SERVIDOR HOST (no del contenedor).
# El servidor de producción ya no tiene nginx: el reverse proxy público es Apache.
#
# Instalación:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers
#   sudo cp apache/eic.sibi.ucr.ac.cr.conf /etc/apache2/sites-available/eic.sibi.ucr.ac.cr.conf
#   sudo a2ensite eic.sibi.ucr.ac.cr
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
#   # TLS con Let's Encrypt (igual que horas.eic.ucr.ac.cr y tfg.eic.ucr.ac.cr):
#   sudo certbot --apache -d eic.sibi.ucr.ac.cr
#   # certbot crea 'eic.sibi.ucr.ac.cr-le-ssl.conf' (:443) con el certificado,
#   # copia estas reglas de proxy y agrega el redirect 80->443 en este archivo.
#   # Verificar que el -le-ssl.conf quede con el bloque RewriteRule [P] y los ProxyPass.
#
# Flujo:  navegador -> Apache host (:80 / :443) -> contenedor frontend (127.0.0.1:8082)
#         -> nginx interno del contenedor -> /api/ y /hubs/ al contenedor backend.
#
# Puertos ya ocupados en este host: 3000 y 4000 (sihco), 8081 (Snipe-IT). SIBI usa 8082.
#
# IMPORTANTE — vhost "default" accidental: en sites-enabled/ Apache elige como
# default (para cualquier Host que no matchee ningun ServerName/ServerAlias
# declarado en el Apache del host) el PRIMER vhost por orden alfabetico de
# archivo. "eic.sibi.ucr.ac.cr.conf" ordena antes que otros vhosts del mismo
# host (ej. horas.eic.ucr.ac.cr.conf), asi que sin el guard de abajo, CUALQUIER
# dominio/IP no declarado en otro vhost (ej. www.tfg.eic.ucr.ac.cr sin alias
# propio) terminaria serivido por el contenedor de SIBI. El guard rechaza
# cualquier Host que no sea exactamente el de SIBI antes de hacer nada de proxy.

<VirtualHost *:80>
    ServerName eic.sibi.ucr.ac.cr

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^eic\.sibi\.ucr\.ac\.cr$ [NC]
    RewriteRule ^ - [F]

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 3600

    # Esquema real (http/https) hacia el backend, que usa UseForwardedHeaders.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # SignalR: el handshake WebSocket necesita upgrade a ws://. Debe ir ANTES de
    # los ProxyPass. Las peticiones de /hubs/ que NO son WebSocket (negociacion y
    # long-polling de SignalR) caen en el ProxyPass http normal de abajo.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(hubs/.*)$ ws://127.0.0.1:8082/$1 [P,L]

    # Regla especifica antes que la generica "/".
    ProxyPass        /hubs/ http://127.0.0.1:8082/hubs/
    ProxyPassReverse /hubs/ http://127.0.0.1:8082/hubs/

    ProxyPass        /      http://127.0.0.1:8082/
    ProxyPassReverse /      http://127.0.0.1:8082/

    ErrorLog  ${APACHE_LOG_DIR}/eic.sibi.ucr.ac.cr-error.log
    CustomLog ${APACHE_LOG_DIR}/eic.sibi.ucr.ac.cr-access.log combined
</VirtualHost>
