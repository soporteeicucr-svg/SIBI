# Vhost para el Apache del SERVIDOR HOST (no del contenedor).
# Reemplaza al antiguo vhost de nginx: el servidor de producción ya no tiene nginx,
# el reverse proxy público lo hace Apache (que ya escucha en :80 y :443).
#
# Instalación (Debian/Ubuntu):
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
#   sudo cp apache/eic.sibi.ucr.ac.cr.conf /etc/apache2/sites-available/eic.sibi.ucr.ac.cr.conf
#   sudo a2ensite eic.sibi.ucr.ac.cr
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Flujo:  navegador ──▶ Apache host (:80 / :443) ──▶ contenedor frontend (127.0.0.1:8081)
#         el contenedor frontend (nginx interno) sirve el SPA y proxea /api/ y /hubs/
#         al contenedor backend por la red interna de Docker.
#
# El contenedor se publica en el puerto 8081 del host (docker-compose.yml: "8081:80").

# ── HTTP: redirige todo a HTTPS ───────────────────────────────────────────────
<VirtualHost *:80>
    ServerName eic.sibi.ucr.ac.cr

    # Si por ahora se sirve solo por HTTP (sin TLS en este Apache), comentar el
    # bloque de redirección y descomentar el de proxy que está más abajo.
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L]

    # --- Alternativa sin TLS: proxy directo en :80 ---
    # ProxyPreserveHost On
    # ProxyRequests Off
    # ProxyTimeout 3600
    # RewriteEngine On
    # RewriteCond %{HTTP:Upgrade} =websocket [NC]
    # RewriteRule ^/(hubs/.*)$ ws://127.0.0.1:8081/$1 [P,L]
    # ProxyPass        /hubs/ http://127.0.0.1:8081/hubs/
    # ProxyPassReverse /hubs/ http://127.0.0.1:8081/hubs/
    # ProxyPass        /      http://127.0.0.1:8081/
    # ProxyPassReverse /      http://127.0.0.1:8081/

    ErrorLog  ${APACHE_LOG_DIR}/eic.sibi.ucr.ac.cr-error.log
    CustomLog ${APACHE_LOG_DIR}/eic.sibi.ucr.ac.cr-access.log combined
</VirtualHost>

# ── HTTPS: reverse proxy al contenedor frontend ──────────────────────────────
<VirtualHost *:443>
    ServerName eic.sibi.ucr.ac.cr

    SSLEngine on
    # Ajustar a los certificados reales del servidor (o los que gestione la UCR).
    SSLCertificateFile    /etc/ssl/certs/eic.sibi.ucr.ac.cr.crt
    SSLCertificateKeyFile  /etc/ssl/private/eic.sibi.ucr.ac.cr.key
    # SSLCertificateChainFile /etc/ssl/certs/eic.sibi.ucr.ac.cr-chain.crt

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 3600
    RequestHeader set X-Forwarded-Proto "https"

    # SignalR: el handshake WebSocket necesita upgrade a ws://. Debe ir ANTES
    # de los ProxyPass genéricos. Las peticiones de /hubs/ que NO son WebSocket
    # (negociación y long-polling de SignalR) caen en el ProxyPass http normal.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(hubs/.*)$ ws://127.0.0.1:8081/$1 [P,L]

    # Reglas específicas antes que la genérica "/".
    ProxyPass        /hubs/ http://127.0.0.1:8081/hubs/
    ProxyPassReverse /hubs/ http://127.0.0.1:8081/hubs/

    ProxyPass        /      http://127.0.0.1:8081/
    ProxyPassReverse /      http://127.0.0.1:8081/

    ErrorLog  ${APACHE_LOG_DIR}/eic.sibi.ucr.ac.cr-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/eic.sibi.ucr.ac.cr-ssl-access.log combined
</VirtualHost>
