# Vhost para el nginx del SERVIDOR HOST (no del contenedor)
# Colocar en: /etc/nginx/sites-available/eic.sibi.ucr.ac.cr
# Activar con: sudo ln -s /etc/nginx/sites-available/eic.sibi.ucr.ac.cr /etc/nginx/sites-enabled/
# Recargar con: sudo nginx -t && sudo systemctl reload nginx

# Necesario para soporte WebSocket (SignalR). Agregar al bloque http{} del
# nginx.conf principal (/etc/nginx/nginx.conf) si no existe ya:
#
#   map $http_upgrade $sibi_connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

map $http_upgrade $sibi_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name eic.sibi.ucr.ac.cr;

    # Reenviar todo al contenedor frontend de SIBI (puerto 8081 del host)
    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $sibi_connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
